# Gerador de carga DENTRO do cluster (Parte 4, item 5 - autoscaling).
# Um pod busybox que faz wget em loop no Service "loja-api" (DNS interno).
# A rota /carga gasta ~50 ms de CPU por requisição, o que faz o uso de CPU
# dos pods da API passar do alvo do HPA.
#   Ligar:     kubectl apply -f k8s-extras/gerador-carga.yaml
#   Desligar:  kubectl delete -f k8s-extras/gerador-carga.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gerador-carga
  namespace: n3-guilherme
  labels:
    app: gerador-carga
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gerador-carga
  template:
    metadata:
      labels:
        app: gerador-carga
    spec:
      containers:
        - name: carga
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null 'http://loja-api/carga?ms=50'; done"]
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
