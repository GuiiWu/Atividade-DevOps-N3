# BÔNUS - estratégia CANARY.
# Um segundo Deployment com a versão nova (3.0) e só 1 réplica.
# Os pods dele têm  app: loja-api  (igual aos estáveis), então o Service
# "loja-api" (selector app=loja-api) já manda parte do tráfego para eles.
# Com 2 pods stable + 1 canary, ~1/3 das requisições cai na versão nova.
# O label  track: canary  impede que o Deployment principal (que seleciona
# track=stable) "adote" ou mate estes pods.
#
#   Liberar canary:  kubectl apply -f k8s-extras/canary.yaml
#   Promover:        kubectl set image deployment/loja-api api=loja-api:3.0 -n n3-guilherme
#                    kubectl delete -f k8s-extras/canary.yaml
#   Desistir:        kubectl delete -f k8s-extras/canary.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja-api-canary
  namespace: n3-guilherme
  labels:
    app: loja-api
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loja-api
      track: canary
  template:
    metadata:
      labels:
        app: loja-api
        track: canary
    spec:
      containers:
        - name: api
          image: loja-api:3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: loja-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: loja-db-secret, key: MYSQL_PASSWORD }
            - name: APP_MESSAGE
              value: "Versao CANARY da Loja"
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { cpu: 500m, memory: 192Mi }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
