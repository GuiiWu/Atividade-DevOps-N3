# Secret: senhas do banco.
# ATENÇÃO: os valores em "data" estão só codificados em base64, NÃO
# criptografados. Qualquer um com acesso ao arquivo decodifica com
#   [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("dHJvcXVlLWxvamEtMTIz"))
# Por isso aqui só há senhas de EXEMPLO de laboratório (as mesmas do .env.example).
# Em produção as senhas ficariam num cofre (Vault, AWS Secrets Manager,
# Azure Key Vault...) ou em Sealed Secrets / External Secrets, nunca no Git.
apiVersion: v1
kind: Secret
metadata:
  name: loja-db-secret
  namespace: n3-guilherme
  labels:
    app: loja
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: dHJvcXVlLXJvb3QtMTIz   # troque-root-123
  MYSQL_PASSWORD: dHJvcXVlLWxvamEtMTIz        # troque-loja-123
