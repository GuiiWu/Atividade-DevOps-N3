# ConfigMap: configurações NÃO sensíveis da API.
# Viram variáveis de ambiente do container via "envFrom" no Deployment.
# Para mudar um valor basta editar aqui e reiniciar os pods
# (kubectl rollout restart deployment/loja-api -n n3-guilherme).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loja-api-config
  namespace: n3-guilherme
  labels:
    app: loja-api
data:
  PORT: "3000"
  APP_MESSAGE: "Bem-vindo à Loja do Guilherme (Kubernetes)"
  DB_HOST: "mysql"        # nome do Service do MySQL (DNS interno do cluster)
  DB_PORT: "3306"
  DB_NAME: "loja"
  DB_USER: "loja"
  REDIS_HOST: "redis"     # nome do Service do Redis
  REDIS_PORT: "6379"
  CACHE_TTL: "30"
