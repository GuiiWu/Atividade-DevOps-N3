# Docker Compose da Loja: API + MySQL + Redis.
# Subir:   docker compose up -d --build
# Derrubar (mantendo os dados): docker compose down
# Derrubar e APAGAR os dados:   docker compose down -v
#
# Os valores ${...} vêm do arquivo .env (copiado do .env.example).

name: loja

services:
  api:
    build:
      context: ./app
      args:
        APP_VERSION: ${APP_VERSION:-1.0}
    image: loja-api:${APP_VERSION:-1.0}
    container_name: loja-api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DB_HOST: mysql            # nome do serviço = nome DNS na rede do Compose
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_TTL: ${CACHE_TTL:-30}
    # Só sobe a API depois que MySQL e Redis estiverem SAUDÁVEIS
    # (não basta o container ter iniciado: o healthcheck precisa passar).
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [loja]

  mysql:
    image: mysql:8.4
    container_name: loja-mysql
    # env_file passa as variáveis MYSQL_* do .env para o container do MySQL,
    # que cria o banco e o usuário na primeira inicialização.
    env_file: .env
    volumes:
      # Volume nomeado: os dados ficam fora do container e sobrevivem ao
      # "docker compose down" (só somem com "down -v").
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Testa com o usuário da aplicação: só passa quando o MySQL já aceita
      # login (e não apenas quando o processo iniciou).
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [loja]

  redis:
    image: redis:7-alpine
    container_name: loja-redis
    # appendonly: o Redis também grava em disco (contador de visitas persiste).
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [loja]

volumes:
  mysql_data:
  redis_data:

networks:
  loja:
